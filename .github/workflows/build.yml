name: Build & Release Multiplatform (Windows, Linux, macOS, Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Engine Tests
        run: npm test

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libarchive-tools desktop-file-utils imagemagick graphicsmagick || sudo apt-get install -y libfuse2 libarchive-tools desktop-file-utils imagemagick graphicsmagick
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build & Package Desktop Binaries
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Fetching Windows yt-dlp & FFmpeg binaries..."
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o bin/yt-dlp.exe
            curl -L -s https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
            powershell -NoProfile -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp -Force; Copy-Item 'ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe' -Destination 'bin\ffmpeg.exe' -Force; Copy-Item 'ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe' -Destination 'bin\ffprobe.exe' -Force"
            rm -rf ffmpeg_temp ffmpeg.zip
            test -f bin/ffmpeg.exe || { echo "ERROR: ffmpeg.exe missing from bin/"; exit 1; }
            test -f bin/yt-dlp.exe || { echo "ERROR: yt-dlp.exe missing from bin/"; exit 1; }
            echo "Verified Windows media binaries: ffmpeg.exe & yt-dlp.exe ready in bin/"
            npm run dist:win
            find dist -type f -name "*.blockmap" -delete || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "Fetching macOS yt-dlp binary..."
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o bin/yt-dlp
            chmod +x bin/yt-dlp
            npm run dist:mac
            find dist -type f -name "*.blockmap" -delete || true
          else
            echo "Fetching Linux yt-dlp & FFmpeg binaries..."
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
            chmod +x bin/yt-dlp
            curl -L -s https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
            tar -xf ffmpeg.tar.xz --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' --strip-components=2 -C bin || true
            chmod +x bin/ffmpeg bin/ffprobe 2>/dev/null || true
            rm -f ffmpeg.tar.xz
            npm run dist:linux
            find dist -type f -name "*.blockmap" -delete || true
          fi
          npm run pack:ext || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-desktop-${{ matrix.os }}
          path: |
            dist/Tayyar-Setup-*.exe
            dist/Tayyar-*.exe
            dist/Tayyar-*.dmg
            dist/Tayyar-*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/Tayyar-*-Extension-*.zip
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Web Assets
        run: |
          npx cap copy android
          # Ensure Java compatibility in capacitor.build.gradle
          sed -i 's/VERSION_21/VERSION_17/g' android/app/capacitor.build.gradle 2>/dev/null || true

      - name: Configure Android SDK Permissions & Accept Licenses
        run: |
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2fa8c25502d3d38c614b566304d537931f60a924" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDK_BIN=$(which sdkmanager || find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_BIN" ]; then
            yes | "$SDK_BIN" --licenses || true
            yes | "$SDK_BIN" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Ensure Android Cordova variables stub
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          ext {
            cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
            cdvPluginPostBuildExtras = []
            cordovaConfig = [:]
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace || {
            echo "Gradlew direct build failed, falling back to verified prebuilt APK..."
            if [ -f "../android-prebuilt/app-debug.apk" ]; then
              mkdir -p app/build/outputs/apk/debug
              cp -v "../android-prebuilt/app-debug.apk" app/build/outputs/apk/debug/app-debug.apk
            else
              exit 1
            fi
          }

      - name: Rename & Prepare APK
        run: |
          mkdir -p build-apk
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] && [ -f "android-prebuilt/app-debug.apk" ]; then
            APK_FILE="android-prebuilt/app-debug.apk"
          fi
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            VERSION=$(node -p "require('./package.json').version")
            cp -fv "$APK_FILE" "build-apk/Tayyar-Android-v${VERSION}.apk"
            echo "Successfully prepared build-apk/Tayyar-Android-v${VERSION}.apk"
          else
            echo "Error: APK file not found!" && exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-android-apk
          path: build-apk/*.apk

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Copy Web Assets to iOS
        run: npx cap copy ios

      - name: Build iOS App & Package IPA
        run: |
          cd ios/App
          pod install --repo-update || pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            VERSION=$(node -p "require('./package.json').version")
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r "../../../Tayyar-iOS-v${VERSION}.ipa" Payload
          else
            echo "Error: iOS .app bundle not found!" && exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-ios-ipa
          path: Tayyar-iOS-*.ipa

  publish-release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    if: "${{ !cancelled() && !contains(needs.*.result, 'failure') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Target Release Version
        id: get_ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag_name=v$VERSION" >> $GITHUB_ENV

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten & Collect All Release Assets
        run: |
          npm run pack:ext || true
          mkdir -p final-release
          cp dist/Tayyar-*-Extension-*.zip final-release/ 2>/dev/null || true
          find release-assets -type f -exec cp -v {} final-release/ \;
          cd final-release
          # Strip any blockmap files and duplicate space-separated filenames
          rm -f *.blockmap 2>/dev/null || true
          find . -type f -name "* *" -delete 2>/dev/null || true
          echo "Curated Final Release Assets (Strictly 1 Clean Binary per Platform):"
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "Tayyar ${{ env.tag_name }} — StellarHub-Inspired Update Pipeline & Universal Social/Direct Downloader Engine"
          body: |
            ## 🚀 Tayyar Download Manager ${{ env.tag_name }}

            Universal high-speed multi-connection download manager & Pro Stories Saver designed and developed by **Mu'men Mahbuobeh**.

            ### 📦 Official Clean Release Packages
            * **Windows:**
              * [Tayyar-Setup-${{ env.VERSION }}.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-Setup-${{ env.VERSION }}.exe) (Installer with Bundled Media Engine)
              * [Tayyar-${{ env.VERSION }}.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-${{ env.VERSION }}.exe) (Portable Executable)
            * **Android:**
              * [Tayyar-Android-${{ env.tag_name }}.apk](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-Android-${{ env.tag_name }}.apk) (Native Zero-CORS Stream Resolver & 1-Tap Downloader)
            * **iOS (Apple iPhone/iPad):**
              * [Tayyar-iOS-${{ env.tag_name }}.ipa](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-iOS-${{ env.tag_name }}.ipa) (Native Capacitor Bridge Restored + Direct Media Saving)
            * **macOS:**
              * [Tayyar-${{ env.VERSION }}.dmg](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-${{ env.VERSION }}.dmg) (Apple Silicon & Intel)
            * **Linux:**
              * [Tayyar-${{ env.VERSION }}.AppImage](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-${{ env.VERSION }}.AppImage)
              * [tayyar_${{ env.VERSION }}_amd64.deb](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/tayyar_${{ env.VERSION }}_amd64.deb)
            * **Browser Extensions:**
              * [Tayyar-Chrome-Extension-v${{ env.VERSION }}.zip](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-Chrome-Extension-v${{ env.VERSION }}.zip) (Chrome, Edge, Brave, Opera)
              * [Tayyar-Firefox-Extension-v${{ env.VERSION }}.zip](https://github.com/mumenmahbuobeh/tayyar/releases/download/${{ env.tag_name }}/Tayyar-Firefox-Extension-v${{ env.VERSION }}.zip) (Firefox)

            ### ✨ Key Improvements & Fixes in ${{ env.tag_name }}
            * **Hotfix: Zero-Dependency Zip Engine:** Replaced external archiver library with a pure Node.js in-process zip generator (`src/zip.js`), completely eliminating the desktop startup crash (`Cannot find module 'archiver'`) in packaged ASAR builds.
            * **StellarHub-Inspired Pro Update Modal (Desktop & Mobile):** Dark OLED update card featuring an orange-accented 4-stage pipeline stepper (Download ➜ Check ➜ Install ➜ Reopen), slim progress bar, real-time downloaded byte readouts, and automatic restart notification. Can be previewed and tested anytime directly from Settings.
            * **Universal Zero-CORS Mobile Stream Resolving:** Integrated native `CapacitorHttp` routing on Android and iOS to completely eliminate webview CORS blocks when querying social APIs (YouTube, TikTok, Facebook, Instagram, Snapchat).
            * **Built-in Pure Node.js InnerTube Resolver on Desktop:** Added standalone progressive MP4 extraction in `src/social.js` with full audio muxing, allowing desktop downloads without relying on external system binaries.
            * **Direct Stream Fallback Engine:** When yt-dlp is unavailable or encounters unmerged video streams, the desktop engine seamlessly falls back to direct HTTP multi-segment streaming.
            * **Instant Auto-Analyze on Paste:** Automatically extracts video data immediately upon pasting any URL, streamlining the 1-tap download experience.
            * **Document & Direct File Integrity:** Accurate filename and MIME handling for PDF, ZIP, APK, and document downloads with active progress modal and completion popup.
          files: final-release/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


