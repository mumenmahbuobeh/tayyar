name: Build & Release Multiplatform (Windows, Linux, macOS, Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Engine Tests
        run: npm test

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libarchive-tools desktop-file-utils imagemagick graphicsmagick || sudo apt-get install -y libfuse2 libarchive-tools desktop-file-utils imagemagick graphicsmagick
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build & Package Desktop Binaries
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run dist:win
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Web Assets
        run: npx cap copy android

      - name: Install Android SDK & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2fa8c25502d3d38c614b566304d537931f60a924" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDK_BIN=$(which sdkmanager || find $ANDROID_HOME -name sdkmanager -type f | head -n 1)
          if [ -n "$SDK_BIN" ]; then
            yes | "$SDK_BIN" --licenses || true
            yes | "$SDK_BIN" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename & Prepare APK
        run: |
          mkdir -p build-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-apk/Tayyar-Android-v1.0.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-android-apk
          path: build-apk/Tayyar-Android-v1.0.0.apk

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Copy Web Assets to iOS
        run: npx cap copy ios

      - name: Build iOS App & Package IPA
        run: |
          cd ios/App
          pod install --repo-update || pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean archive -archivePath build/App.xcarchive
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r ../../../Tayyar-iOS-v1.0.0.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-ios-ipa
          path: Tayyar-iOS-v1.0.0.ipa

  publish-release:
    name: Create GitHub Release
    needs: [build-desktop, build-android, build-ios]
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Assets
        run: ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Tayyar v1.0.0 — Multiplatform Release (Windows, Linux, macOS, Android, iOS)"
          body: |
            ## 🚀 Tayyar Download Manager v1.0.0

            Universal high-speed multi-connection download manager designed and developed by **Mu'men Mahbuobeh**.

            ### 📦 Download Packages
            * **Windows:**
              * [Tayyar Setup 1.0.0.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar.Setup.1.0.0.exe) (Installer)
              * [Tayyar 1.0.0.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar.1.0.0.exe) (Portable)
            * **Android:**
              * [Tayyar-Android-v1.0.0.apk](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar-Android-v1.0.0.apk) (Android 7.0+)
            * **iOS (Apple iPhone/iPad):**
              * [Tayyar-iOS-v1.0.0.ipa](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar-iOS-v1.0.0.ipa) (Sideload / AltStore / TrollStore)
            * **macOS:**
              * [Tayyar-1.0.0.dmg](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar-1.0.0.dmg) (Apple Silicon & Intel)
            * **Linux:**
              * [Tayyar-1.0.0.AppImage](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar-1.0.0.AppImage)
              * [tayyar_1.0.0_amd64.deb](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/tayyar_1.0.0_amd64.deb)

            ### ✨ Key Features
            * Dynamic Multi-Threaded Chunking (up to 64 connections per file)
            * 200+ Universal File Extensions categorized automatically
            * Seamless download resilience for Russian, Chinese, Iranian, and international servers
            * Integrated Browser Extensions for Chrome, Edge, Firefox, Safari, Brave, Opera, Vivaldi, Arc
            * Pure Vanilla Glassmorphism Bento Grid UI with native Arabic (RTL) & English (LTR) support
          files: release-assets/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
