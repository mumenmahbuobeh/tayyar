name: Build & Release Multiplatform (Windows, Linux, macOS, Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Engine Tests
        run: npm test

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils

      - name: Build & Package Desktop Binaries
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run dist:win
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename & Prepare APK
        run: |
          mkdir -p build-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-apk/Tayyar-Android-v1.0.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-android-apk
          path: build-apk/Tayyar-Android-v1.0.0.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Assets
        run: ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Tayyar v1.0.0 — Multiplatform Release (Windows, Linux, macOS, Android)"
          body: |
            ## 🚀 Tayyar Download Manager v1.0.0

            Universal high-speed multi-connection download manager designed and developed by **Mu'men Mahbuobeh**.

            ### 📦 Download Packages
            * **Windows:**
              * [Tayyar Setup 1.0.0.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar.Setup.1.0.0.exe) (Installer)
              * [Tayyar 1.0.0.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar.1.0.0.exe) (Portable)
            * **Android:**
              * [Tayyar-Android-v1.0.0.apk](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar-Android-v1.0.0.apk) (Android 7.0+)
            * **macOS:**
              * [Tayyar-1.0.0.dmg](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar-1.0.0.dmg) (Apple Silicon & Intel)
            * **Linux:**
              * [Tayyar-1.0.0.AppImage](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/Tayyar-1.0.0.AppImage)
              * [tayyar_1.0.0_amd64.deb](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.0/tayyar_1.0.0_amd64.deb)

            ### ✨ Key Features
            * Dynamic Multi-Threaded Chunking (up to 64 connections per file)
            * 200+ Universal File Extensions categorized automatically
            * Seamless download resilience for Russian, Chinese, Iranian, and international servers
            * Integrated Browser Extensions for Chrome, Edge, Firefox, Safari, Brave, Opera, Vivaldi, Arc
            * Pure Vanilla Glassmorphism Bento Grid UI with native Arabic (RTL) & English (LTR) support
          files: release-assets/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
