name: Build & Release Multiplatform (Windows, Linux, macOS, Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Engine Tests
        run: npm test

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libarchive-tools desktop-file-utils imagemagick graphicsmagick || sudo apt-get install -y libfuse2 libarchive-tools desktop-file-utils imagemagick graphicsmagick
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build & Package Desktop Binaries
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o bin/yt-dlp.exe
            npm run dist:win
            cp dist/Tayyar-Setup-*.exe dist/Tayyar.Setup.1.0.5.exe 2>/dev/null || true
            cp dist/Tayyar-1.0.5.exe dist/Tayyar.1.0.5.exe 2>/dev/null || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o bin/yt-dlp
            chmod +x bin/yt-dlp
            npm run dist:mac
            cp dist/Tayyar-*.dmg dist/Tayyar-1.0.5.dmg 2>/dev/null || true
          else
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
            chmod +x bin/yt-dlp
            npm run dist:linux
            cp dist/*.deb dist/tayyar_1.0.5_amd64.deb 2>/dev/null || true
            cp dist/*.AppImage dist/Tayyar-1.0.5.AppImage 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Web Assets
        run: npx cap copy android

      - name: Setup Android SDK Tools & Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a2b8e3f21a877329712e3b5045b\nt6940b124e15230559e468094b82d5414bd6477e\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Ensure Android Cordova variables stub
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          echo "ext { cdvMinSdkVersion = 24; cdvPluginPostBuildExtras = []; cordovaConfig = [:] }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Build Android APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename & Prepare APK
        run: |
          mkdir -p build-apk
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-apk/Tayyar-Android-v1.0.5.apk
          else
            echo "Error: APK file not found!" && exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-android-apk
          path: build-apk/*.apk

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Copy Web Assets to iOS
        run: npx cap copy ios

      - name: Build iOS App & Package IPA
        run: |
          cd ios/App
          pod install --repo-update || pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r ../../../Tayyar-iOS-v1.0.5.ipa Payload
          else
            echo "Error: iOS .app bundle not found!" && exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-ios-ipa
          path: Tayyar-iOS-v1.0.5.ipa

  publish-release:
    name: Create GitHub Release
    needs: [build-desktop, build-android, build-ios]
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten & Collect All Release Assets
        run: |
          mkdir -p final-release
          find release-assets -type f -exec cp -v {} final-release/ \;
          ls -la final-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Tayyar v1.0.5 — Multiplatform Release (Windows, Linux, macOS, Android, iOS)"
          body: |
            ## 🚀 Tayyar Download Manager v1.0.5

            Universal high-speed multi-connection download manager designed and developed by **Mu'men Mahbuobeh**.

            ### 📦 Download Packages
            * **Windows:**
              * [Tayyar Setup 1.0.5.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.5/Tayyar.Setup.1.0.5.exe) (Installer)
              * [Tayyar 1.0.5.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.5/Tayyar.1.0.5.exe) (Portable)
            * **Android:**
              * [Tayyar-Android-v1.0.5.apk](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.5/Tayyar-Android-v1.0.5.apk) (Android 7.0+)
            * **iOS (Apple iPhone/iPad):**
              * [Tayyar-iOS-v1.0.5.ipa](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.5/Tayyar-iOS-v1.0.5.ipa) (Sideload / AltStore / TrollStore)
            * **macOS:**
              * [Tayyar-1.0.5.dmg](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.5/Tayyar-1.0.5.dmg) (Apple Silicon & Intel)
            * **Linux:**
              * [Tayyar-1.0.5.AppImage](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.5/Tayyar-1.0.5.AppImage)
              * [tayyar_1.0.5_amd64.deb](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.5/tayyar_1.0.5_amd64.deb)

            ### ✨ Key Features
            * Dynamic Multi-Threaded Chunking (up to 64 connections per file)
            * 200+ Universal File Extensions categorized automatically
            * Seamless download resilience for Russian, Chinese, Iranian, and international servers
            * Integrated Browser Extensions for Chrome, Edge, Firefox, Safari, Brave, Opera, Vivaldi, Arc
            * Apple Liquid Glass Design Language with native Arabic (RTL) & English (LTR) support
          files: final-release/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


