name: Build & Release Multiplatform (Windows, Linux, macOS, Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Engine Tests
        run: npm test

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libarchive-tools desktop-file-utils imagemagick graphicsmagick || sudo apt-get install -y libfuse2 libarchive-tools desktop-file-utils imagemagick graphicsmagick
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build & Package Desktop Binaries
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Fetching Windows yt-dlp & FFmpeg binaries..."
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o bin/yt-dlp.exe
            curl -L -s https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
            powershell -NoProfile -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp -Force; Copy-Item 'ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe' -Destination 'bin\ffmpeg.exe' -Force; Copy-Item 'ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe' -Destination 'bin\ffprobe.exe' -Force"
            rm -rf ffmpeg_temp ffmpeg.zip
            test -f bin/ffmpeg.exe || { echo "ERROR: ffmpeg.exe missing from bin/"; exit 1; }
            test -f bin/yt-dlp.exe || { echo "ERROR: yt-dlp.exe missing from bin/"; exit 1; }
            echo "Verified Windows media binaries: ffmpeg.exe & yt-dlp.exe ready in bin/"
            npm run dist:win
            find dist -type f -name "*.blockmap" -delete || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "Fetching macOS yt-dlp binary..."
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o bin/yt-dlp
            chmod +x bin/yt-dlp
            npm run dist:mac
            find dist -type f -name "*.blockmap" -delete || true
          else
            echo "Fetching Linux yt-dlp & FFmpeg binaries..."
            curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
            chmod +x bin/yt-dlp
            curl -L -s https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
            tar -xf ffmpeg.tar.xz --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' --strip-components=2 -C bin || true
            chmod +x bin/ffmpeg bin/ffprobe 2>/dev/null || true
            rm -f ffmpeg.tar.xz
            npm run dist:linux
            find dist -type f -name "*.blockmap" -delete || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-desktop-${{ matrix.os }}
          path: |
            dist/Tayyar-Setup-1.0.18.exe
            dist/Tayyar-1.0.18.exe
            dist/Tayyar-1.0.18.dmg
            dist/Tayyar-1.0.18.AppImage
            dist/tayyar_1.0.18_amd64.deb
            dist/latest*.yml
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Web Assets
        run: npx cap copy android

      - name: Install Android SDK & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2fa8c25502d3d38c614b566304d537931f60a924" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDK_BIN=$(which sdkmanager || find $ANDROID_HOME -name sdkmanager -type f | head -n 1)
          if [ -n "$SDK_BIN" ]; then
            yes | "$SDK_BIN" --licenses || true
            yes | "$SDK_BIN" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Ensure Android Cordova variables stub
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          ext {
            cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
            cdvPluginPostBuildExtras = []
            cordovaConfig = [:]
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename & Prepare APK
        run: |
          mkdir -p build-apk
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp -fv "$APK_FILE" build-apk/Tayyar-Android-v1.0.18.apk
          else
            echo "Error: APK file not found!" && exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-android-apk
          path: build-apk/Tayyar-Android-v1.0.18.apk

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Copy Web Assets to iOS
        run: npx cap copy ios

      - name: Build iOS App & Package IPA
        run: |
          cd ios/App
          pod install --repo-update || pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r ../../../Tayyar-iOS-v1.0.18.ipa Payload
          else
            echo "Error: iOS .app bundle not found!" && exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyar-ios-ipa
          path: Tayyar-iOS-v1.0.18.ipa

      - name: Attach iOS IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.18
          files: Tayyar-iOS-v1.0.18.ipa
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten & Collect All Release Assets
        run: |
          mkdir -p final-release
          find release-assets -type f -exec cp -v {} final-release/ \;
          cd final-release
          # Strip any blockmap files, old version assets, and duplicate space-separated filenames
          rm -f *.blockmap 2>/dev/null || true
          rm -f *1.0.0* *1.0.5* *1.0.6* *1.0.7* *1.0.8* *1.0.9* *1.0.10* *1.0.11* *1.0.12* *1.0.13* *1.0.14* *1.0.15* *1.0.16* *1.0.17* 2>/dev/null || true
          find . -type f -name "* *" -delete 2>/dev/null || true
          echo "Curated Final Release Assets (Strictly 1 Clean Binary per Platform):"
          ls -la

      - name: Clean up Obsolete & Duplicate Release Assets from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scanning GitHub releases for obsolete or duplicate assets..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases" | \
          jq -r '.[] | .assets[]? | select((.name | test("1\\.0\\.18") | not) or (.name | test(" ")) or (.name | endswith(".blockmap"))) | "\(.id) \(.name)"' | while read -r asset_id asset_name; do
            if [ -n "$asset_id" ] && [ -n "$asset_name" ]; then
              echo "Withdrawing & deleting unwanted release asset: $asset_name (ID: $asset_id)"
              curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id" || true
            fi
          done || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.18
          name: "Tayyar v1.0.18 — Native Mobile Capacitor Bridge Fix, Robust PDF Engine, Active Multi-Segment Visualizer & Complete POPUP"
          body: |
            ## 🚀 Tayyar Download Manager v1.0.18

            Universal high-speed multi-connection download manager & Pro Stories Saver designed and developed by **Mu'men Mahbuobeh**.

            ### 📦 Download Packages (Official & Clean Binaries)
            * **Windows:**
              * [Tayyar-Setup-1.0.18.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.18/Tayyar-Setup-1.0.18.exe) (Installer with Bundled Media Engine)
              * [Tayyar-1.0.18.exe](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.18/Tayyar-1.0.18.exe) (Portable Executable)
            * **Android:**
              * [Tayyar-Android-v1.0.18.apk](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.18/Tayyar-Android-v1.0.18.apk) (Native Capacitor Bridge Restored + Direct 1-Tap Video Downloader)
            * **iOS (Apple iPhone/iPad):**
              * [Tayyar-iOS-v1.0.18.ipa](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.18/Tayyar-iOS-v1.0.18.ipa) (Native Capacitor Bridge Restored + Direct Video Saving)
            * **macOS:**
              * [Tayyar-1.0.18.dmg](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.18/Tayyar-1.0.18.dmg) (Apple Silicon & Intel)
            * **Linux:**
              * [Tayyar-1.0.18.AppImage](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.18/Tayyar-1.0.18.AppImage)
              * [tayyar_1.0.18_amd64.deb](https://github.com/mumenmahbuobeh/tayyar/releases/download/v1.0.18/tayyar_1.0.18_amd64.deb)

            ### ✨ Key Improvements & Fixes in v1.0.18
            * **Fixed Mobile Video Downloads (Android & iOS):** Restored and bundled the missing `capacitor.js` bridge file directly in the app package, enabling the native Java/Swift download engine (`TayyarMobilePlugin`) to intercept and handle all video downloads seamlessly.
            * **Instant 1-Tap Video Download on Mobile:** Clicking "Analyze & Download" (فحص وتحميل) now automatically triggers the native download immediately and redirects smoothly to the downloads tab.
            * **Robust PDF & Document Downloader (Desktop & Extensions):** Automatic detection of `application/pdf` MIME types, fallback query parameter extraction, and stripping of dynamic script extensions (`.php`, `.aspx`, `.jsp`) so documents are always saved with genuine `.pdf` extensions. Supported non-range dynamic servers.
            * **Active Download Interface (Advanced Window):** Interactive window during active downloads displaying real-time transfer speed, multi-segment connection visualizer (threads/chunks bar), ETA, Pause, Resume, Stop & Cancel, and dynamic speed limiter.
            * **Download Complete POPUP (Apple Liquid Glass):** Beautiful completion modal presenting the saved filename, size, path, with quick actions to "Open File", "Open Folder", or dismiss.
          files: final-release/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


