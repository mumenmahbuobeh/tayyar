<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tayyar Integration</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrap">
    <!-- Brand Header -->
    <header class="popup-header">
      <div class="brand-row">
        <div class="brand-logo">
          <div class="brand-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="brand-info">
            <div class="brand-title-wrap">
              <span class="brand-title">Tayyar</span>
              <span class="brand-badge">PRO</span>
            </div>
            <p class="tagline" id="txtTagline">Next Gen Download Manager</p>
          </div>
        </div>
        <button type="button" class="lang-pill" id="bLang" title="Switch Language / تبديل اللغة">AR</button>
      </div>
    </header>

    <!-- Connection Status Bento Card -->
    <div class="status-card" id="statusCard">
      <div class="status-left">
        <span class="status-pulse-dot" id="statusDot"></span>
        <div class="status-meta">
          <span class="status-title" id="statusTxt">Connecting to Desktop App...</span>
          <span class="status-sub" id="statusSub">Bridge (127.0.0.1:6824)</span>
        </div>
      </div>
      <span class="status-tag" id="statusTag">ONLINE</span>
    </div>

    <!-- Quick Download Bento Card -->
    <div class="bento-card quick-download-card">
      <div class="card-head">
        <span class="card-title" id="lblQuickAdd">Quick Download</span>
        <span class="card-hint" id="lblQuickHint">Direct URL & Streams</span>
      </div>
      <div class="input-wrap">
        <input type="url" id="quickUrlInput" placeholder="https://example.com/file.zip" autocomplete="off" spellcheck="false">
        <button type="button" class="btn-cyan-add" id="bSendDownload" title="Send to Tayyar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div class="feedback-msg" id="feedbackMsg" hidden></div>
    </div>

    <!-- Integration Settings Bento Card -->
    <div class="bento-card settings-card">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title" id="lblCapture">Intercept Downloads</span>
          <span class="toggle-desc" id="descCapture">Capture browser downloads automatically</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chkCapture" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="divider"></div>

      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title" id="lblVideoBadge">Floating Video Button</span>
          <span class="toggle-desc" id="descVideoBadge">Show quick download badge on video players</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chkVideoBadge" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Quick Actions / App Controls -->
    <div class="actions-row">
      <button type="button" class="action-btn" id="bOpenDesktop" title="Bring Tayyar Desktop to Front">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        <span id="txtOpenDesk">Open Desktop App</span>
      </button>
      <button type="button" class="action-btn" id="bDownloadZip" title="Download Extension .ZIP Package">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span id="txtDownloadZip">Export .ZIP</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="footer-engine">⚡ Tayyar Turbo Engine</span>
      <span class="version-txt">v1.0.27</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
